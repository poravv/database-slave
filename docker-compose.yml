version: '3.8'
services:
  client1:
    build:
      context: .
      dockerfile: Dockerfile.client1
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=dbtest
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${CLIENT1_PASSWORD}
    volumes:
      - client1-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my1.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3333:3306"
    networks:
      mysql_slaves:
        aliases:
          - client1
          - master
    hostname: client1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client2:
    build:
      context: .
      dockerfile: Dockerfile.client2
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=dbtest
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${CLIENT2_PASSWORD}
    volumes:
      - client2-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my2.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3334:3306"
    networks:
      mysql_slaves:
        aliases:
          - client2
          - slave1
    hostname: client2
    restart: unless-stopped
    depends_on:
      client1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client3:
    build:
      context: .
      dockerfile: Dockerfile.client3
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=dbtest
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${CLIENT3_PASSWORD}
    volumes:
      - client3-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my3.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3335:3306"
    networks:
      mysql_slaves:
        aliases:
          - client3
          - slave2
    hostname: client3
    restart: unless-stopped
    depends_on:
      client1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client4:
    build:
      context: .
      dockerfile: Dockerfile.client4
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - MARIADB_DATABASE=dbtest
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${CLIENT4_PASSWORD}
    volumes:
      - client4-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./my4.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3336:3306"
    networks:
      mysql_slaves:
        aliases:
          - client4
          - slave3
    hostname: client4
    restart: unless-stopped
    depends_on:
      client1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  client1-data:
  client2-data:
  client3-data:
  client4-data:

networks:
  mysql_slaves:
    driver: bridge
